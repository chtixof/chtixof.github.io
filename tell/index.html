<html>
<!--By ChtiXof, 2015-->
  <head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-15">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tell</title>
<style type="text/css">
  body { background: #CECECE; font-family: Arial, Sans-Serif; }
  h1 {margin: 0 0 15px 0;}
  #cont { margin: 0 auto; padding: 10px 0;width: 600px; }
  #box { padding: 25px 30px 25px 30px; background: #fff; margin-bottom: 10px; }
  #goo {width:600px;}
  #text {width:100%; height:300px;margin-bottom: 10px;}
  #md {display:none}
  .icoimg {width:16px; height:16px;float: right;padding: 2px;  cursor: pointer;}
  code {
    background-color: rgba(0,0,0,0.04);
    color: #283B53;
    font-family: monospace;
    padding: 0px 4px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  @media (max-width: 850px) {
    #cont {
        padding: 10px; 
        margin: 10px auto !important;
        font-size: 14px; 
        max-width: 100%; 
        box-sizing: border-box; 
    }
}
</style>
<script language="javascript" src="lib/lz-string.min.js"></script>
<script language="javascript" src="lib/marked.js"></script>
<script language="javascript" src="lib/jquery-2.1.3.min.js"></script>
  </head>
  <body>
    <div id='cont'>
      <div id='box'></div>
      <div id="md">
        You may want to edit the markdown code:
        <textarea id='text'></textarea>
        <img src="img/orangelockopen.png" alt="Lock!" title="Lock!" class="icoimg" id='tell'>
      </div>
      <img src="img/greenlockclose.png" alt="Unlock!" title="Unlock!" class="icoimg" id='show'>
      </div>
<script type="text/javascript">

//
function init(){
  frag=window.location.hash.substr(1);
  $("#text").html((frag.length===0) ? `# [Tell](#)

- Click on the bottom right locker ![](img/greenlockclose.png) to unlock this document
- This displays a text box with the text coded in [Markdown](https://github.com/adam-p/markdown-here/wiki/Markdown-Cheatsheet)
- Edit the text and type in whatever you want
- Click back on the locker ![](img/orangelockopen.png) to relock the document
- This encodes the page with the new text and updates the URL
- You may then copy the URL and use it elsewhere

What you typed is not sent to the server: it is fully coded in the URL.

Remember: you are responsible for what you write.

More [about Tell](http://chtixof.github.io/tell-universal-html-page/).
     ` : LZString.decompressFromEncodedURIComponent(frag));
  $("#box").html(marked($("#text").text()));
}

// jquery
$(document).ready(function() {
  var frag='';
  init();

  $(window).bind('hashchange', function () { 
    init();
  });

  $("#tell").click(function() {
    window.location.hash=LZString.compressToEncodedURIComponent($("#text").val());
    $("#md").hide();
    $("#show").show();
  });
  $("#show").click(function() {
    $("#md").show();
    $("#show").hide();
  });
});
</script>
  </body>
</html>
